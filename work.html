<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Hyunsuk Erickson</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        @font-face {
            font-family: GeoSans; /* set name */
            src: url(assets/fonts/geo-sans-light/GeosansLight.ttf); /* url of the font */
        }

        * {box-sizing: border-box;}

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            perspective: 1px;
            transform-style: preserve-3d;
            height: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            font-family: 'GeoSans';
            color: #003399;
        }

        h1 {
            font-size: 250%;
        }

        p {
            font-size: 140%;
            line-height: 150%;
            color: #333;
        }
        header {
            overflow: hidden;
            padding: 50px;
        }

        header a {
            float: left;
            text-align: center;
            padding: 12px;
            font-size: 18px; 
            line-height: 25px;
            border-radius: 4px;
            color: #003399;
        }

        .header-right {
            float: right;
        }

        a {
            text-decoration: none;
            position: relative;
            z-index: auto;
        }
        
        @media screen and (max-width: 500px) {
            header a {
                float: none;
                display: block;
                text-align: left;
            }
            
            .header-right {
                float: none;
            }

            .slide .title {
                width : 100%;
            }

            .slide:nth-child(n) .showOff{
                max-width: 100%;
                position: relative;
                top: auto;
                left: auto;
                right: auto;
                margin-left: auto;
                margin-right: auto;
            }
        }

        #title {
            z-index: 50 !important;
        }

        #title h1 {
            transform-origin: 50% 100%;
        }
        
        $num-of-slide: 5;

        .wrapper {
            max-width: 60em;
            margin: 1em auto;
            position: relative;
        }

        input {
            display: none;
        }

        .inner {
            width: percentage($num-of-slide);
            line-height: 0;
        }

        article {
            width: percentage(1/$num-of-slide);
            float: left;
            position: relative;

            img {
                width: 100%;
            }
        }

        /*---- SET UP CONTROL ----*/
        .slider-prev-next-control {
            height: 50px;
            position: absolute;
            top: 50%;
            width: 100%;
            @include transform(translateY(-50%));

            label {
                display: none;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: #fff;
                opacity: 0.7;

                &:hover {
                    opacity: 1;
                }
            }
        }

        .slider-dot-control {
            position: absolute;
            width: 100%;
            bottom: 0;
            text-align: center;

            label {
                cursor: pointer;
                border-radius: 5px;
                display: inline-block;
                width: 10px;
                height: 10px;
                background: #bbb;
                @include transition(all 0.3s);

                &:hover {
                    background: #ccc;
                    border-color: #777;
                }
            }
        }

        /* Info Box */
        .info {
            position: absolute;
            font-style: italic;
            line-height: 20px;
            opacity: 0;
            color: #000;
            text-align: left;
            @include transition(all 1000ms ease-out 600ms);

            h3 {
                color: #fcfff4;
                margin: 0 0 5px;
                font-weight: normal;
                font-size: 1.5em;
                font-style: normal;
            }

            &.top-left {
                top: 30px;
                left: 30px;
            }

            &.top-right {
                top: 30px;
                right: 30px;
            }

            &.bottom-left {
                bottom: 30px;
                left: 30px;
            }

            &.bottom-right {
                bottom: 30px;
                right: 30px;
            }
        }

        /* Slider Styling */
        .slider-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 5px;
            box-shadow: 1px 1px 4px #666;
            background: #fff;
            background: #fcfff4;
            @include transform(translateZ(0));
            @include transition(all 500ms ease-out);

            .inner {
                @include transform(translateZ(0));
                @include transition(all 800ms cubic-bezier(0.77, 0, 0.175, 1));
            }
        }

        /*---- SET POSITION FOR SLIDE ----*/
        %bind-prev-next-button {
            font-family: FontAwesome;
            font-style: normal;
            font-weight: normal;
            text-decoration: inherit;
            margin: 0;
            line-height: 38px;
            font-size: 3em;
            display: block;
            color: #777;
        }

        %bind-next-button {
            @extend %bind-prev-next-button;
            content: "\f105";
            padding-left: 15px;
        }

        %bind-next-label {
            display: block;
            float: right;
            margin-right: 5px;
        }

        %bind-prev-label {
            display: block;
            float: left;
            margin-left: 5px;
        }

        %bind-prev-button {
            @extend %bind-prev-next-button;
            content: "\f104";
            padding-left: 8px;
        }

        %bind-background-active-dot {
            background: #333;
        }

        %bind-opacity-info {
            opacity: 1;
        }

        @for $i from 1 through $num-of-slide {
            #slide#{$i}:checked {
                & ~ .slider-wrapper .inner {
                    margin-left: percentage(1 - $i);
                }

                & ~ .slider-dot-control label:nth-child(#{$i}) {
                    @extend %bind-background-active-dot;
                }

                & ~ .slider-wrapper article:nth-child(#{$i}) .info {
                    @extend %bind-opacity-info;
                }
            }
        }

        @for $i from 1 through ($num-of-slide - 1) {
            #slide#{$i}:checked {
                & ~ .slider-prev-next-control label:nth-child(#{$i +1}) {
                    @extend %bind-next-label;

                    &::after {
                        @extend %bind-next-button;
                    }
                }
            }
        }

        #slide#{$num-of-slide}:checked ~ .slider-prev-next-control label:nth-child(1) {
            @extend %bind-next-label;

            &::after {
                @extend %bind-next-button;
            }
        }

        @for $i from 2 through $num-of-slide {
            #slide#{$i}:checked {
                & ~ .slider-prev-next-control label:nth-child(#{$i - 1}) {
                    @extend %bind-prev-label;

                    &::after {
                        @extend %bind-prev-button;
                    }
                }
            }
        }

        #slide#{1}:checked ~ .slider-prev-next-control label:nth-child(#{$num-of-slide}) {
            @extend %bind-prev-label;

            &::after {
                @extend %bind-prev-button;
            }
        }

        /*---- TABLET ----*/
        @media only screen and (max-width: 850px) and (min-width: 450px) {
            .slider-wrapper {
                border-radius: 0;
            }
        }

        /*---- MOBILE----*/
        @media only screen and (max-width: 450px) {
            .slider-wrapper {
                border-radius: 0;
            }

            .slider-wrapper .info {
                opacity: 0;
            }
        }

        @media only screen and (min-width: 850px) {
            body {
                padding: 0 80px;
            }
        }










    </style>

</head>
