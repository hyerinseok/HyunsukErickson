    <style>
        @font-face {
            font-family: GeoSans; /* set name */
            src: url(assets/fonts/geo-sans-light/GeosansLight.ttf); /* url of the font */
        }

        * {box-sizing: border-box;}

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            perspective: 1px;
            transform-style: preserve-3d;
            height: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            font-family: 'GeoSans';
            color: #003399;
        }

        h1 {
            font-size: 250%;
        }

        p {
            font-size: 140%;
            line-height: 150%;
            color: #333;
        }
        header {
            overflow: hidden;
            padding: 50px;
        }

        header a {
            float: left;
            text-align: center;
            padding: 12px;
            font-size: 18px; 
            line-height: 25px;
            border-radius: 4px;
            color: #003399;
        }

        .header-right {
            float: right;
        }

        a {
            text-decoration: none;
            position: relative;
            z-index: auto;
        }
        
        @media screen and (max-width: 500px) {
            header a {
                float: none;
                display: block;
                text-align: left;
            }
            
            .header-right {
                float: none;
            }

            .slide .title {
                width : 100%;
            }

            .slide:nth-child(n) .showOff{
                max-width: 100%;
                position: relative;
                top: auto;
                left: auto;
                right: auto;
                margin-left: auto;
                margin-right: auto;
            }
        }

        body>h1{
            padding: 0 10%;
        }
ul {
  width: 100vw;
  display: flex;
}
li {
  list-style-type: none;
  background-color: #eeeeee;
  flex: 1;
}

li:nth-child(even) {
  background-color: cyan;
}
li>img{
    height: 50vw;
}
ul {
  overflow-x: scroll;
  scroll-snap-type: x mandatory;
}
li {
  scroll-snap-align: center;
}
ul::scroll-button(*) {
  border: 0;
  font-size: 2rem;
  background: none;
  color: black;
  opacity: 0.7;
  cursor: pointer;
}

ul::scroll-button(*):hover,
ul::scroll-button(*):focus {
  opacity: 1;
}

ul::scroll-button(*):active {
  translate: 1px 1px;
}

ul::scroll-button(*):disabled {
  opacity: 0.2;
  cursor: unset;
}
ul::scroll-button(left) {
  content: "◄" / "Previous";
}

ul::scroll-button(right) {
  content: "►" / "Next";
}
ul {
  anchor-name: --my-carousel;
}

ul::scroll-button(*) {
  position: absolute;
  position-anchor: --my-carousel;
}
ul::scroll-button(left) {
  right: calc(anchor(left) - 70px);
  top: calc(anchor(top) + 25vw);
}

ul::scroll-button(right) {
  left: calc(anchor(right) - 70px);
  top: calc(anchor(top) + 25vw);
}
ul {
  scroll-marker-group: after;
}
ul::scroll-marker-group {
  position: absolute;
  position-anchor: --my-carousel;
  top: calc(anchor(bottom) - 70px);
  justify-self: anchor-center;

  display: flex;
  justify-content: center;
  gap: 20px;
}

.horizontal-scroll {
  width: 100vw;          /* Restricts the box width */
  overflow-x: auto;     /* Adds horizontal scrollbar when items overflow */
  overflow-y: none;
  white-space: nowrap;  /* Prevents child elements from breaking to the next line */
  height: 50vw;
}

.item {
  display: inline-block; /* Forces items to stay side-by-side */
  width: auto;
  height: 50vw;
  background-color: #f0f0f0;
}

.item>img {
  height: 50vw;
}

    </style>
