<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Hyunsuk Erickson</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        * {box-sizing: border-box;}
        @font-face {
            font-family: GeoSans; /* set name */
            src: url(assets/fonts/geo-sans-light/GeosansLight.ttf); /* url of the font */
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        header {
            position: relative;
            z-index: 100 !important;
            overflow: hidden;
            padding: 10px 10%;
            background-color: rgba(255, 255, 255, 0.8);
            display: grid;
            grid-template-columns: auto auto;
        }

        header a {
            float: left;
            text-align: left;
            padding: 0 12px;
            font-size: 18px; 
            line-height: 15px;
            border-radius: 4px;
            color: #003399;
        }

        .header-right {
            float: right;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body {
            margin: 0;
            padding: 0;
            perspective: 1px;
            transform-style: preserve-3d;
            height: 100%;
            overflow-y: hidden;
            overflow-x: hidden;
            font-family: 'GeoSans';
            color: #003399;
            position: relative;
        }

        h1 {
            font-size: 250%;
        }

        p {
            font-size: 140%;
            line-height: 150%;
            color: #333;
        }

        .slide {
            position: relative;
            padding: 20px 10%;
            min-height: 100px;
            width: 100%;
            box-sizing: border-box;
            transform-style: inherit;
        }

        .slide:before {
            content: "";
            position: absolute;
            top: 0px;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .title {
            width: 50%;
            padding: 5%;
            border-radius: 5px;
            background: rgba(240, 230, 220, .7);
        }

        .slide:nth-child(2n+1) .title {
            margin-left: 0;
            margin-right: auto;
        }

        .slide:nth-child(2n) .title {
            margin-left: auto;
            margin-right: 0;
        }

        #main_image {
            max-width: 100%;
            height: stretch;
            z-index: 0 !important;
        }

        #main_image:before {
            background-image: url(assets/img/home_image.webp);
            transform: translateZ(-0.7px) scale(2);
            height: stretch;
        }

        .showOff {
            max-width: 40%;
            height: stretch;
        }

        .showOff > *{
            max-width: stretch;
            max-height: stretch;
            transform: translateZ(.1px) scale(0.9) rotate(3deg);
            border-radius: 5px;
            background: rgba(240, 230, 220, .7);
            box-shadow: 0 0 8px rgba(0, 0, 0, .7);
        }

        .slide:nth-child(2n+1) .showOff{
            position: absolute;
            top: 5%;
            right: 10%;
            margin-left: 0;
            margin-right: auto;
        }

        .slide:nth-child(2n) .showOff{
            position: absolute;
            top: 5%;
            left: 10%;
            margin-left: auto;
            margin-right: 0;
        }

        .slide,
        .slide:before {
            background: 50% 50% / cover;
        }

        a {
            text-decoration: none;
            position: relative;
            z-index: auto;
        }
        #title {
            z-index: 50 !important;
        }

        #title h1 {
            transform-origin: 50% 100%;
        }

        #slide_end {
            background: lightblue;
            display: grid;
            grid-template-columns: 70% auto;
            z-index: 5 !important;
            position: fixed;
            bottom: 0;
            align-content: center;  /* Vertical block-axis center */
        }

        .footer>*{
            margin: 2px;
        }

        img.socialmedia {
            width: 5%;
            align-content: center;
            margin: 2px;
            float: right;
        }

        
        @media screen and (max-width: 500px) {
            header {
                display: grid;
                grid-template-rows: auto auto;
                grid-template-columns: none;
            }
            
            header a {
                float: none;
                display: block;
                text-align: center;
                line-height: 20px;
            }
            
            .header-right {
                float: none;
            }

            #slide_end {
                display: grid;
                grid-template-rows: auto auto;
                grid-template-columns: none;
            }

            #slide_end>*{
                display: flex;
                align-items: center;
                justify-content: center;
            }

            img.socialmedia {
                margin: 2px;
                float: none;
            }

            
        }

    </style>
    <meta name="theme-color" content="#fafafa">
</head>

<body>
    <header>

        <a href="index.html" class="logo"><h1>Hyunsuk Erickson</h1></a>
        <div class="header-right">
            <a href="work.html">Work</a>
            <a href="news.html">News</a>
            <a href="bio.html">Bio</a>
        </div>
    </header>

    <div id="main_image" class="slide">
    </div>
    
    <div id="slide_end" class="slide header">
        <div class="footer">
            <h3>Hyunsuk Erickson</h3>
            <p>© All Rights Reserved​​</p>
        </div>
        <div class="socialmedia">
            <img class="socialmedia" src="assets/img/instagram.png">
            <img class="socialmedia" src="assets/img/facebook.png">
            <!--https://www.flaticon.com/-->
        </div>
    </div>

    <script src="js/vendor/modernizr-3.8.0.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"
        integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>
    <script>window.jQuery || document.write('<script src="js/vendor/jquery-3.4.1.min.js"><\/script>')</script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
